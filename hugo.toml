baseURL = 'https://wurongpi.github.io/'
locale = 'zh-CN'
title = '个人主页'
theme = 'shibui'
enableGitInfo = true                    # 用 Git 提交时间作为“最后修改时间”
hasCJKLanguage = true                   # 让中文的字数和阅读时间统计准确

[params]
description = "探索研究和工程，试图享受创造的乐趣"
showtoc = true                    # 文章目录
showreadingtime = true            # 阅读时间
showlastmod = false               # 主题这一项有 bug，修复方法见指导第 8 步
comments = false                  # 主题评论用的是 Disqus，国内基本打不开，先关掉
[params.author]
name = "吕荣杰"
email = "lv_rongjie@outlook.com"

[markup]
[markup.goldmark.renderer]
unsafe = true # 允许在 Markdown 里写 HTML
[markup.highlight]
noClasses = true
style = "algol_nu" # 代码高亮配色，与主题演示站一致
[markup.tableOfContents]
startLevel = 2
endLevel = 4
ordered = true

[menus]
[[menus.main]]
name = "Posts"
pageRef = "/posts"
weight = 10
[[menus.main]]
name = "Tags"
pageRef = "/tags"
weight = 20
[[menus.main]]
name = "About"
pageRef = "/about"
weight = 30

[frontmatter]
lastmod = [':git', 'lastmod', 'date', 'publishDate']
